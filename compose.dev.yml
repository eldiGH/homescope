volumes:
  pgdata:
  grafana-data:

services:
  mqtt-broker:
    image: docker.io/eclipse-mosquitto:2-openssl
    ports:
      - "127.0.0.1:1883:1883"

    volumes:
      - "./deploy/mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro"

    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 500ms

  homescope-db:
    image: docker.io/timescale/timescaledb:2.28.2-pg18
    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: homescope
      POSTGRES_PASSWORD: dev

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 500ms
  grafana:
    image: docker.io/grafana/grafana:12.2
    ports:
      - "127.0.0.1:4000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: dev
      GRAFANA_DB_USER: postgres
      GRAFANA_DB_PASSWORD: dev
      GRAFANA_ALLOW_UI_UPDATES: "true"
    
    volumes:
      - "./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro"
      - "./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro"
      - "./deploy/grafana/dashboards:/etc/grafana/dashboards:ro"
      - "grafana-data:/var/lib/grafana"
    
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 500ms
