[package]
name = "homescope-common"
version = "0.1.0"
edition = "2024"

[features]
default = []
codec = ["dep:crc", "dep:memchr"]
serde = ["dep:serde", "dep:chrono", "serde/alloc", "dep:base64"]
defmt = ["dep:defmt"]
crypto = ["dep:chacha20poly1305", "dep:zeroize"]
keygen = ["dep:getrandom"]

[dependencies]
base64 = { version = "0.23.0", default-features = false, features = ["alloc"], optional = true }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"], optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["serde"], optional = true }
crc = { version = "3.4.0", optional = true }
defmt = { version = "1.1.1", optional = true }
getrandom = { version = "0.4.3", optional = true, features = ["std"] }
memchr = { version = "2.8.3", default-features = false, optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }
thiserror = { version = "2.0.19", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
# Host-only, and only for tests. The `serde` impls here are exercised through
# a *reader*-backed deserializer, which is the one shape that cannot borrow
# from its input — see `device_addr::test::deserializes_from_a_reader`.
serde_json = "1.0.150"
