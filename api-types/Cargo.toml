[package]
name = "homescope-api-types"
version = "0.1.0"
edition = "2024"

[dependencies]
homescope-common = { workspace = true, features = ["serde"] }

chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }

# A runtime dependency, not only a test one: an error body's `details` stays
# raw JSON until its `code` says how to read it (see `error::ApiErrorDetails`).
# Both consumers already link it — axum in the API, ureq in provision — so it
# adds nothing to either build. The goldens use it too, because a wire
# contract is only pinned by tests that state the JSON as literals.
serde_json = "1.0.150"
