# The `broker` component's Mosquitto (homescope-mqtt.container). Same rules as
# the dev broker and as any external broker homescope publishes to: no
# anonymous clients, and an ACL giving each user only its own topics. Both
# files are generated by deploy.sh from deploy.toml and mounted as secrets.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# The API's durable session (clean_session=false, QoS 1) lets the broker queue
# envelopes while the API is down; persistence keeps that queue across a
# broker restart. The default limit of 1000 is ~16 h for one sensor.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 10000
