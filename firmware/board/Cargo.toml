[package]
name = "homescope-board"
version = "0.1.0"
edition = "2024"

[features]
db40 = []
xiao = []

[lib]
bench=false
test=false

[dependencies]
homescope-common = { workspace = true }

embassy-nrf = { version = "0.10.0", features = ["nrf52840"] }

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", artifact-dir = "out/examples/receiver" }
]


