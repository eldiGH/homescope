name: build-image
on:
  workflow_call:
    inputs:
      crate:
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with: 
          context: .
          file: ${{ inputs.crate }}/Containerfile
          push: true
          tags: |
            ghcr.io/eldigh/homescope-${{ inputs.crate }}:latest
            ghcr.io/eldigh/homescope-${{ inputs.crate }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.crate }}
          cache-to: type=gha,scope=${{ inputs.crate }},mode=max
