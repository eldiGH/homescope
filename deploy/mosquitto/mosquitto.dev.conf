# Dev broker (compose.dev.yml): authenticated, with the production ACL, so dev
# exercises the same login and topic rules as production. The credentials in
# dev/ are dev-only and committed on purpose; the listener is published on
# 127.0.0.1 only. Mosquitto 2.0 warns that dev/passwd and dev/acl are
# world-readable: they have to be, as the broker runs as uid 1883 in the
# container and reads them through the bind mount.
listener 1883
allow_anonymous false
password_file /mosquitto/config/dev/passwd
acl_file /mosquitto/config/dev/acl
