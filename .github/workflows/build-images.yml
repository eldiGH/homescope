name: build-images
on:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        crate: [api, gateway]
      
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with: 
          context: .
          file: ${{ matrix.crate }}/Containerfile
          push: true
          tags: |
            ghcr.io/eldigh/homescope-${{ matrix.crate }}:latest
            ghcr.io/eldigh/homescope-${{ matrix.crate }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.crate }}
          cache-to: type=gha,scope=${{ matrix.crate }},mode=max
