[package]
name = "homescope-provision"
version = "0.1.0"
edition = "2024"

[dependencies]
homescope-common = { workspace = true, features = ["crypto"] }
homescope-api-types = { workspace = true }

clap = { version = "4.6.6", features = ["derive", "env"] }
probe-rs = "0.32.0"
anyhow = "1.0.104"
thiserror = "2.0.20"
ureq = { version = "3.4.0", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
toml = "1.1.6"
rpassword = "7.5.4"
zeroize = "1.9.0"
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "std"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"

