[package]
name = "homescope-api"
version = "0.1.0"
edition = "2024"

[dependencies]
homescope-common = { workspace = true, features = ["serde", "codec", "crypto"]}
homescope-host-util = { workspace = true }

anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
rumqttc = "0.25.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["chrono", "derive", "macros", "migrate", "postgres", "runtime-tokio"], default-features = false }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chacha20poly1305 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }
